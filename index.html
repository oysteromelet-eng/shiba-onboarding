<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐕 柴柴探險隊迎新基地</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:"Microsoft JhengHei",sans-serif;

    background:linear-gradient(
        135deg,
        #eff6ff,
        #dbeafe
    );

    min-height:100vh;
}

.container{
    max-width:800px;
    margin:auto;
}

.card{
    background:white;
    border-radius:24px;
    padding:40px;
    margin-bottom:20px;

    text-align:center;

    box-shadow:
        0 10px 30px rgba(0,0,0,.1);
}

.logo{
    font-size:80px;
}

h1,h2{
    color:#2563eb;
}

.subtitle{
    font-size:18px;
    line-height:1.8;
    color:#475569;
    margin:20px 0;
}

.features{
    text-align:left;
    max-width:320px;
    margin:auto;
}

.features p{
    margin:12px 0;
    font-size:18px;
}

.btn{
    background:#2563eb;
    color:white;
    border:none;

    padding:14px 32px;

    border-radius:999px;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.btn:hover{
    background:#1d4ed8;
}

.form-section{
    display:none;
}

.form-section.show{
    display:block;
}

input{
    width:100%;

    padding:14px;

    margin-bottom:15px;

    border:1px solid #d1d5db;

    border-radius:12px;

    font-size:16px;
}

.result{
    margin-top:20px;

    background:#ecfdf5;

    border:2px solid #10b981;

    border-radius:16px;

    padding:20px;

    text-align:left;
}

.hidden{
    display:none;
}

.code-name{
    font-size:28px;
    font-weight:bold;
    color:#2563eb;
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#64748b;
}

@media(max-width:768px){

    .card{
        padding:24px;
    }

    .logo{
        font-size:60px;
    }

    h1{
        font-size:28px;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- 首頁 -->

    <div class="card">

        <div class="logo">🐕</div>

        <h1>柴柴探險隊迎新基地</h1>

        <div class="subtitle">

            歡迎來到新的冒險旅程！<br>
            完成探險任務，打造專屬柴柴身分卡，<br>
            認識新同學，一起快樂學習！

        </div>

        <div class="features">

            <p>🏅 專屬柴柴代號</p>
            <p>🏅 特質徽章</p>
            <p>📖 柴柴故事</p>
            <p>🎭 猜猜我是誰角色卡</p>

        </div>

        <br>

        <button
            class="btn"
            onclick="startAdventure()">
            🚀 開始探險
        </button>

    </div>

    <!-- 報到區 -->

    <div
        id="onboarding"
        class="card form-section">

        <h2>🎒 入隊報到</h2>

        <p>請填寫你的探險員資料</p>

<input
    id="name"
    placeholder="你的名字">

<input
    id="subject"
    placeholder="最喜歡的科目（例如：數學）">

<input
    id="talent"
    placeholder="我的專長（例如：唱歌）">

<input
    id="interest"
    placeholder="我的興趣（例如：畫畫、音樂）">

<input
    id="dream"
    placeholder="我的夢想">

        <button
            class="btn"
            onclick="generateCard()">

            🐕 生成角色卡

        </button>

        <div
            id="result"
            class="result hidden">
        </div>

    </div>

    <div class="footer">

        Powered by 柴柴探險隊

    </div>

</div>

<script>

function startAdventure(){

    const onboarding =
        document.getElementById(
            "onboarding"
        );

    onboarding.classList.add(
        "show"
    );

    onboarding.scrollIntoView({

        behavior:"smooth"

    });

}

function generateCodeName(
    subject,
    interest,
    dream
){

    let first = "";
    let second = "";

    if(
        dream.includes("老師")
    ){
        first = "夢想";
    }
    else if(
        dream.includes("科學")
    ){
        first = "科學";
    }
    else if(
        dream.includes("醫")
    ){
        first = "守護";
    }
    else{
        first = "探險";
    }

    if(
        subject.includes("數學")
    ){
        second = "智慧";
    }
    else if(
        subject.includes("自然")
    ){
        second = "探索";
    }
    else if(
        interest.includes("畫")
    ){
        second = "彩繪";
    }
    else if(
        interest.includes("音樂")
    ){
        second = "音樂";
    }
    else{
        second = "勇氣";
    }

    return first + second + "柴";

}


function generateCard(){

    const name =
        document.getElementById("name")
        .value.trim();

    const interest =
        document.getElementById("interest")
        .value.trim();

    const dream =
        document.getElementById("dream")
        .value.trim();

    if(
        name === "" ||
        interest === "" ||
        dream === ""
    ){

        alert(
            "請完成所有欄位喔！"
        );

        return;
    }

    const codeName =
        generateCodeName(
            interest,
            dream
        );

    const result =
        document.getElementById(
            "result"
        );

    result.classList.remove(
        "hidden"
    );

    result.innerHTML = `
        <h3>🎉 入隊成功！</h3>

        <p class="code-name">
            🐕 ${codeName}
        </p>

        <p>
            <strong>探險員：</strong>
            ${name}
        </p>

        <p>
            <strong>興趣：</strong>
            ${interest}
        </p>

        <p>
            <strong>夢想：</strong>
            ${dream}
        </p>

        <hr>

        <p>
        ${codeName} 喜歡透過
        「${interest}」
        探索世界，
        並朝著
        「${dream}」
        的方向勇敢前進！
        </p>
    `;
}

</script>

</body>
</html>
