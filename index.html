body{

}

.container{

.features{

    margin:auto;
}

.features p{
    font-size:18px;
    margin:12px 0;
}

.btn{
    display:inline-block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:14px 30px;
    border-radius:999px;
    font-size:20px;
    font-weight:bold;
    border:none;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{

}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
    box-sizing:border-box;
}

.result{
    margin-top:20px;
    background:#ecfdf5;
    border:2px solid #10b981;
    border-radius:16px;
    padding:20px;
    text-align:left;
}

.codeName{
    font-size:24px;
    font-weight:bold;
    color:#2563eb;
}

.footer{
    margin-top:20px;
    color:#64748b;
    font-size:14px;
    text-align:center;
}

.hidden{
    display:none;
}

@media(max-width:768px){

    .card{
        padding:25px;
    }

    .logo{
        font-size:60px;
    }

    h1{
        font-size:28px;
    }

    .btn{
        width:100%;
    }
}

</style>

</head>
